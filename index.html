  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"16a2db03-1172-4f18-bccf-3fb77a14f089\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<title>Vincent Quach — Me.exe<\u002Ftitle>\n<link rel=\"icon\" href=\"12980eae-23ca-45fd-9fd5-7029a8e1d927\">\n<script>\n/* Phones and small tablets get the plain site: a windowed desktop needs a pointer\n   and room. ?desktop=1 forces the shell anyway. */\n(function () {\n  try {\n    var p = new URLSearchParams(location.search);\n    if (p.has('desktop')) return;\n    var coarse = matchMedia('(pointer: coarse)').matches;\n    var narrow = Math.min(screen.width, screen.height) < 820 || innerWidth < 820;\n    if (coarse && narrow) location.replace('site.html');\n  } catch (e) {}\n})();\n<\u002Fscript>\n<style>\n  body { margin:0; background:#12232b; overflow:hidden; font-family:Tahoma,Verdana,\"DejaVu Sans\",system-ui,sans-serif; }\n  a { color:#7fc3d8; }\n  a:hover { color:#d98f7a; }\n  @keyframes winIn { from { opacity:0; transform:scale(.97) } to { opacity:1; transform:scale(1) } }\n<\u002Fstyle>\n<script src=\"abea7d0c-6000-407b-b175-55883c36ebfb\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n\n<div style=\"position:fixed;inset:0;overflow:hidden;user-select:none\">\n\n  <!-- wallpaper -->\n  <div style=\"{{ wallStyle }}\"><\u002Fdiv>\n\n  <!-- desktop icons -->\n  <div style=\"position:absolute;top:18px;left:14px;display:flex;flex-direction:column;gap:6px;z-index:1\">\n    <sc-for list=\"{{ icons }}\" as=\"ic\" hint-placeholder-count=\"4\">\n      <button data-app=\"{{ ic.id }}\" sc-camel-on-double-click=\"{{ openApp }}\" sc-camel-on-click=\"{{ selectIcon }}\" style=\"{{ ic.style }}\">\n        <span style=\"{{ ic.tile }}\">\n        <sc-if value=\"{{ ic.isImg }}\" hint-placeholder-val=\"{{ false }}\">\n          <span role=\"img\" aria-label=\"{{ ic.label }}\" style=\"{{ ic.artStyle }}\"><\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ ic.isMono }}\" hint-placeholder-val=\"{{ true }}\">{{ ic.mono }}<\u002Fsc-if>\n        <\u002Fspan>\n        <span style=\"font-size:11px;line-height:1.25;color:#f2ece4;text-shadow:0 1px 2px rgba(0,0,0,.9);text-align:center;max-width:76px;text-wrap:pretty\">{{ ic.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- windows -->\n  <sc-for list=\"{{ wins }}\" as=\"w\" hint-placeholder-count=\"0\">\n    <div data-id=\"{{ w.id }}\" sc-camel-on-mouse-down=\"{{ focusWin }}\" style=\"{{ w.frame }}\">\n\n      <div data-id=\"{{ w.id }}\" sc-camel-on-mouse-down=\"{{ startDrag }}\" sc-camel-on-double-click=\"{{ maxWin }}\" style=\"{{ w.bar }}\">\n        <span style=\"width:15px;height:15px;flex:none;display:block;position:relative\">\n          <sc-if value=\"{{ w.hasIcon }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"{{ w.iconStyle }}\"><\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ w.noIcon }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"position:absolute;inset:0;border-radius:3px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff\">{{ w.mono }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fspan>\n        <span style=\"font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1\">{{ w.title }}<\u002Fspan>\n        <span style=\"display:flex;gap:3px;flex:none\">\n          <button data-id=\"{{ w.id }}\" sc-camel-on-click=\"{{ minWin }}\" aria-label=\"Minimize\" style=\"width:20px;height:18px;border:1px solid rgba(255,255,255,.45);border-radius:3px;background:rgba(255,255,255,.16);color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0\" style-hover=\"background:rgba(255,255,255,.3)\">_<\u002Fbutton>\n          <button data-id=\"{{ w.id }}\" sc-camel-on-click=\"{{ maxWin }}\" aria-label=\"Maximize\" style=\"width:20px;height:18px;border:1px solid rgba(255,255,255,.45);border-radius:3px;background:rgba(255,255,255,.16);color:#fff;font-size:9px;line-height:1;cursor:pointer;padding:0\" style-hover=\"background:rgba(255,255,255,.3)\">□<\u002Fbutton>\n          <button data-id=\"{{ w.id }}\" sc-camel-on-click=\"{{ closeWin }}\" aria-label=\"Close\" style=\"width:20px;height:18px;border:1px solid rgba(255,255,255,.5);border-radius:3px;background:rgba(180,60,50,.75);color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0\" style-hover=\"background:rgba(210,70,55,.95)\">×<\u002Fbutton>\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- window chrome -->\n      <sc-if value=\"{{ w.hasChrome }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:none;background:#d6d2c6;border-bottom:1px solid #6f6a5e\">\n          <!-- menu bar -->\n          <div data-menuroot=\"1\" style=\"position:relative;z-index:20;display:flex;align-items:center;gap:2px;height:20px;padding:0 4px;border-bottom:1px solid #b9b4a6\">\n            <sc-for list=\"{{ w.menus }}\" as=\"m\" hint-placeholder-count=\"6\">\n              <span style=\"position:relative\">\n                <button data-id=\"{{ w.id }}\" data-menu=\"{{ m.name }}\" sc-camel-on-click=\"{{ toggleMenu }}\" sc-camel-on-mouse-enter=\"{{ hoverMenu }}\" style=\"{{ m.style }}\">{{ m.name }}<\u002Fbutton>\n                <sc-if value=\"{{ m.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"position:absolute;top:100%;left:0;display:block;min-width:198px;padding:2px;background:#d6d2c6;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #4a453b;border-bottom:1px solid #4a453b;box-shadow:3px 3px 6px rgba(0,0,0,.35)\">\n                    <sc-for list=\"{{ m.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n                      <span style=\"display:block\">\n                        <sc-if value=\"{{ it.isSep }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"display:block;height:0;margin:3px 2px;border-top:1px solid #a29c8c;border-bottom:1px solid #fdfbf6\"><\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ it.isItem }}\" hint-placeholder-val=\"{{ true }}\">\n                          <button data-id=\"{{ w.id }}\" data-act=\"{{ it.act }}\" sc-camel-on-click=\"{{ runMenuItem }}\" style=\"{{ it.style }}\" style-hover=\"background:#2f5f7a;color:#fff\">\n                            <span style=\"flex:1;text-align:left;white-space:nowrap\">{{ it.label }}<\u002Fspan>\n                            <span style=\"flex:none;padding-left:22px;color:#6b6459;font-size:10px\">{{ it.accel }}<\u002Fspan>\n                          <\u002Fbutton>\n                        <\u002Fsc-if>\n                      <\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ w.isBrowser }}\" hint-placeholder-val=\"{{ false }}\">\n          <!-- toolbar -->\n          <div style=\"display:flex;align-items:stretch;gap:1px;padding:3px 4px;border-bottom:1px solid #b9b4a6;background:linear-gradient(180deg,#e2ded2,#d2cec2)\">\n            <span style=\"width:4px;border-left:1px solid #fff;border-right:1px solid #a29c8c;margin-right:3px\"><\u002Fspan>\n            <button data-id=\"{{ w.id }}\" data-dir=\"back\" sc-camel-on-click=\"{{ navBrowser }}\" title=\"Back\" style=\"{{ w.tbMain }}\"><span style=\"font-size:13px;color:#2a4d66\">◀<\u002Fspan>Back<\u002Fbutton>\n            <button data-id=\"{{ w.id }}\" data-dir=\"fwd\" sc-camel-on-click=\"{{ navBrowser }}\" title=\"Forward\" style=\"{{ w.tbMain }}\"><span style=\"font-size:13px;color:#2a4d66\">▶<\u002Fspan>Forward<\u002Fbutton>\n            <span style=\"width:4px;border-left:1px solid #fff;border-right:1px solid #a29c8c;margin:2px 3px\"><\u002Fspan>\n            <button data-id=\"{{ w.id }}\" data-dir=\"stop\" sc-camel-on-click=\"{{ navBrowser }}\" title=\"Stop\" style=\"{{ w.tbIcon }}\"><span style=\"font-size:12px;color:#93372c\">✖<\u002Fspan><\u002Fbutton>\n            <button data-id=\"{{ w.id }}\" data-dir=\"reload\" sc-camel-on-click=\"{{ navBrowser }}\" title=\"Refresh\" style=\"{{ w.tbIcon }}\"><span style=\"font-size:12px;color:#2f6b3f\">↻<\u002Fspan><\u002Fbutton>\n            <button data-id=\"{{ w.id }}\" data-dir=\"home\" sc-camel-on-click=\"{{ navBrowser }}\" title=\"Home\" style=\"{{ w.tbIcon }}\"><span style=\"font-size:12px;color:#7a5c1f\">⌂<\u002Fspan><\u002Fbutton>\n            <span style=\"width:4px;border-left:1px solid #fff;border-right:1px solid #a29c8c;margin:2px 3px\"><\u002Fspan>\n            <button data-id=\"{{ w.id }}\" data-dir=\"print\" sc-camel-on-click=\"{{ navBrowser }}\" title=\"Print\" style=\"{{ w.tbIcon }}\"><span style=\"font-size:11px;color:#4a443c\">▤<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- address bar -->\n          <div style=\"display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #b9b4a6\">\n            <span style=\"font-size:11px;color:#3a352d;flex:none;padding-left:2px\">Address<\u002Fspan>\n            <div style=\"flex:1;display:flex;align-items:center;gap:6px;height:20px;padding:0 6px;background:#fff;border-top:1px solid #6f6a5e;border-left:1px solid #6f6a5e;border-right:1px solid #f4f1e9;border-bottom:1px solid #f4f1e9;min-width:0\">\n              <span style=\"{{ w.faviconStyle }}\"><\u002Fspan>\n              <input data-id=\"{{ w.id }}\" value=\"{{ w.addr }}\" sc-camel-on-change=\"{{ onAddr }}\" sc-camel-on-key-down=\"{{ onAddrKey }}\" spellcheck=\"false\" style=\"flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:11px;color:#1e1b16\">\n            <\u002Fdiv>\n            <button data-id=\"{{ w.id }}\" data-dir=\"go\" sc-camel-on-click=\"{{ navBrowser }}\" style=\"display:f Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;padding:9px 10px;background:#fdfbf6\">\n                  <span style=\"font-size:11px;color:#2a5f78;cursor:default\">View system information<\u002Fspan>\n                  <span style=\"font-size:11px;color:#2a5f78;cursor:default\">Add or remove programs<\u002Fspan>\n                  <span style=\"font-size:11px;color:#2a5f78;cursor:default\">Change a setting<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid #c3bcab;border-radius:5px;overflow:hidden\">\n                <div style=\"{{ pcPanelHead }}\">Other Places<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;padding:9px 10px;background:#fdfbf6\">\n                  <span style=\"font-size:11px;color:#2a5f78;cursor:default\">Desktop<\u002Fspan>\n                  <span style=\"font-size:11px;color:#2a5f78;cursor:default\">My Documents<\u002Fspan>\n                  <span style=\"font-size:11px;color:#2a5f78;cursor:default\">Network<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;padding:9px 10px;border:1px solid #c3bcab;border-radius:5px;background:#fdfbf6\">\n                <div style=\"font-size:10px;letter-spacing:.6px;color:#8a8377;margin-bottom:5px\">SYSTEM<\u002Fdiv>\n                <div style=\"font-size:11px;color:#3a352d;line-height:1.6\">Custom build<br>6 cores / 12 threads · 16 GB · 1 TB<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- main -->\n            <div style=\"flex:1;min-width:0;overflow:auto;padding:12px 18px 12px\">\n              <div style=\"font-size:12px;font-weight:700;color:#2f2a26;padding-bottom:6px;border-bottom:1px solid #c3bcab;margin-bottom:10px\">Components in This Computer<\u002Fdiv>\n\n              <div style=\"display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap\">\n                <!-- side-vi     <span style=\"font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)\">{{ machineName }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#f5f1e9;padding:6px\">\n        <sc-for list=\"{{ icons }}\" as=\"ic\" hint-placeholder-count=\"4\">\n          <button data-app=\"{{ ic.id }}\" sc-camel-on-click=\"{{ openApp }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border:none;border-radius:5px;background:transparent;cursor:pointer;text-align:left\" style-hover=\"background:#e0d8cb\">\n            <span style=\"{{ ic.menuTile }}\">\n        <sc-if value=\"{{ ic.isImg }}\" hint-placeholder-val=\"{{ false }}\">\n          <span role=\"img\" aria-label=\"{{ ic.label }}\" style=\"{{ ic.artStyle }}\"><\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ ic.isMono }}\" hint-placeholder-val=\"{{ true }}\">{{ ic.mono }}<\u002Fsc-if>\n            <\u002Fspan>\n            <span style=\"font-size:12px;color:#2f2a26\">{{ ic.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"height:1px;background:#cfc7b8;margin:6px 4px\"><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeAll }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border:none;border-radius:5px;background:transparent;cursor:pointer;text-align:left\" style-hover=\"background:#e0d8cb\">\n          <span style=\"width:22px;height:22px;border-radius:4px;background:#b4a08f;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff\">⏻<\u002Fspan>\n          <span style=\"font-size:12px;color:#2f2a26\">Close All Windows<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- taskbar (tb) -->\n  <div style=\"{{ taskbarStyle }}\">\n    <button sc-camel-on-click=\"{{ toggleStart }}\" style=\"{{ startBtnStyle }}\">\n      <span style=\"width:18px;height:18px;flex:none;background-image:url(&quot;8b7a33b6-c538-4c97-affe- ntitled.txt', w: 480, h: 360 },\n    machine: { label: 'About This Machine', mono: 'i', kind: 'stub', title: 'About This Machine', w: 460, h: 300,\n               stubText: 'A desktop for one person. Built by hand, no vendor, no updates. More programs get installed as they are needed.' }\n  };\n\n  // Icon data arrives as data URIs; their \";base64,\" confuses inline-style parsing,\n  // so hand back a blob: URL (no semicolons) instead.\n  ic(p) {\n    if (!p) return '';\n    const src = (window.MEEXE_ICONS || {})[p];\n    if (!src) return p;\n    this._blobs = this._blobs || {};\n    if (this._blobs[p]) return this._blobs[p];\n    try {\n      const [head, b64] = src.split(',');\n      const mime = head.slice(5).replace(';base64', '');\n      const bin = atob(b64);\n      const buf = new Uint8Array(bin.length);\n      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);\n      this._blobs[p] = URL.createObjectURL(new Blob([buf], { type: mime }));\n      return this._blobs[p];\n    } catch (e) { return p; }\n  }\n  accent() { return this.props.accentColor || '#c97b62'; }\n  machine() { return this.props.machineName || 'Me.exe'; }\n\n  componentDidMount() {\n    this.tick();\n    this._ci = setInterval(this.tick, 15000);\n    window.addEventListener('mousedown', this.onDocDown, true);\n    window.addEventListener('mousemove', this.onMove);\n    window.addEventListener('mouseup', this.onUp);\n    window.addEventListener('keydown', this.onKey);\n    try {\n      const n = JSON.parse(localStorage.getItem('meexe_notes') || '{}');\n      if (n && typeof n === 'object') this.setState({ notes: n });\n    } catch (e) {}\n    if (this.props.autoOpenSite !== false) this.waitForViewport(() => this.open('site', { max: true }));\n  }\n  componentWillUnmount() {\n    clearInterval(this._ci);\n    window.removeEventListener('mousedown', this.onDocDown, true);\n    window.removeEventListener('mousemove', this.onMove);\n    window.removeEventListener('mouseup', this.onUp);\n    window.removeEventListener('keydown', this.onKey);\n  }\n\n  tick = () => {\n    const d = new Date();\n    let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM';\n    h = h % 12 || 12;\n    this.setState({ clock: h + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + ap });\n  };\n  onKey = (e) => { if (e.key === 'Escape') this.setState({ startOpen: false, menu: null }); };\n\n  waitForViewport(fn, tries) {\n    const n = tries || 0;\n    if (window.innerWidth > 200 && window.innerHeight > 200) { setTimeout(fn, 60); return; }\n    if (n > 90) { setTimeout(fn, 60); return; }\n    requestAnimationFrame(() => this.waitForViewport(fn, n + 1));\n  }\n\n  viewport() {\n    return { vw: Math.max(window.innerWidth || 0, 640), vh: Math.max((window.innerHeight || 0) - 38, 420) };\n  }\n\n  open(app, opts) {\n    const a = this.APPS[app]; if (!a) return;\n    const existing = this.state.wins.find((w) => w.app === app);\n    if (existing) { this.focus(existing.id, { min: false }); this.setState({ startOpen: false }); return; }\n    const n = this.state.wins.length;\n    const { vw, vh } = this.viewport();\n    const w = Math.max(360, Math.min(a.w, vw - 40));\n    const h = Math.max(240, Math.min(a.h, vh - 40));\n    const z = this.state.zTop + 1;\n    this.setState((s) => ({\n      startOpen: false, zTop: z,\n      wins: [...s.wins, {\n        id: 'w' + Date.now() + n, app, title: a.title, kind: a.kind, mono: a.mono,\n        url: a.url, src: a.src, stubText: a.stubText, status: a.status,\n        x: Math.round((vw - w) / 2 + n * 26), y: Math.round((vh - h) / 2 + n * 22),\n        w, h, min: false, max: !!(opts && opts.max), prev: { x: Math.round((vw - w) / 2), y: Math.round((vh - h) / 2), w, h }, z, navKey: 0\n      }]\n    }));\n  }\n  focus(id, patch) {\n    const z = this.state.zTop + 1;\n    this.setState((s) => ({\n      zTop: z,\n      wins: s.wins.map((w) => (w.id === id ? { ...w, z, ...(patch || {}) } : w))\n    }));\n  }\n  patch(id, patch) {\n    this.set
