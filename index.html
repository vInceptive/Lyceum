  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

220,224,.4);--line:rgba(231,220,224,.1);--line2:rgba(231,220,224,.17);--accent:#d98f7a;--accent-ink:#2b1d1c;--amber:#b58bb0;--grid:rgba(217,143,122,.05);--chip:rgba(217,143,122,.15);--nav:rgba(43,37,48,.75)}\n[data-theme='light']{--bg:#e9e6da;--surface:#f2efe6;--surface2:#e1ddce;--fg:#43443a;--muted:rgba(67,68,58,.64);--faint:rgba(67,68,58,.44);--line:rgba(67,68,58,.12);--line2:rgba(67,68,58,.2);--accent:#6f7d4f;--accent-ink:#f7f5ec;--amber:#b5654a;--grid:rgba(111,125,79,.07);--chip:rgba(111,125,79,.15);--nav:rgba(233,230,218,.75)}\nselect option{color:#111;background:#fff}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-theme=\"{{ theme }}\" style=\"min-height:100vh;background:var(--bg,#2b2530);color:var(--fg,#e7dce0);font-family:'Cabin',system-ui,sans-serif;position:relative;overflow-x:hidden\">\n<div style=\"{{ bgLayerStyle }}\"><\u002Fdiv>\n\n<!-- ===================== PUBLIC SITE ===================== -->\n<sc-if value=\"{{ isSite }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Public site\" style=\"position:relative;z-index:1\">\n\n  <header style=\"position:fixed;top:0;left:0;right:0;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--nav,rgba(43,37,48,.75));border-bottom:1px solid var(--line,rgba(231,220,224,.1))\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:16px 32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px\">\n      <a href=\"#home\" style=\"justify-self:start;display:flex;align-items:center;gap:9px;color:var(--fg,#e7dce0);text-decoration:none\"><img src=\"a2ce6b9b-399f-4805-a8c1-f12d9e0f57d1\" alt=\"\" style=\"border-radius: 10px; display: block; height: 75px; width: 75px\"><span style=\"font-family: 'Corbel','Segoe UI',system-ui,sans-serif; font-size: 32px; font-weight: 300; letter-spacing: .3px; text-transform: lowercase\">V I N C E N T . Q U A C H<\u002Fspan><\u002Fa>\n      <nav style=\"display:flex;gap:30px;justify-self:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.5px\">\n        <a href=\"#about\" style=\"color:var(--muted,rgba(231,220,224,.62));text-decoration:none\">ABOUT<\u002Fa>\n        <a href=\"#writing\" style=\"color:var(--muted,rgba(231,220,224,.62));text-decoration:none\">WRITING<\u002Fa>\n        <a href=\"#contact\" style=\"color:var(--muted,rgba(231,220,224,.62));text-decoration:none\">CONTACT<\u002Fa>\n      <\u002Fnav>\n      <button onclick=\"{{ toggleTheme }}\" style=\"justify-self:end;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:1.5px;padding:8px 15px;border:1px solid var(--line2,rgba(231,220,224,.17));background:transparent;color:var(--fg,#e7dce0);border-radius:999px;cursor:pointer\">{{ themeLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"home\" style=\"position:relative;scroll-margin-top:80px;overflow:hidden\">\n    <div data-parallax=\"hero\" style=\"{{ heroPhotoStyle }}\"><\u002Fdiv>\n    <div style=\"{{ heroScrimStyle }}\"><\u002Fdiv>\n    <div style=\"position:relative;z-index:2;max-width:900px;margin:0 auto;padding:130px 32px 96px;text-align:center\">\n    <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--accent,#d98f7a)\">ENGINEER · ARTIST · REBEL<\u002Fdiv>\n    <img src=\"a2ce6b9b-399f-4805-a8c1-f12d9e0f57d1\" alt=\"\" style=\"border-radius: 10px; display: block; object-fit: fill; position: static; margin-left: auto; margin-right: auto\"><h1 style=\"font-size:clamp(38px,6.4vw,70px);font-weight:300;line-height:1.04;letter-spacing:-1.2px;margin:24px 0 0\">Engineering art for <span style=\"color: var(--accent,#d98f7a); font-weight: 400;\">tomorrow comes.<\u002Fspan><\u002Fh1>\n    <div style=\"height:2px;width:118px;margin:36px auto 30px;background:linear-gradient(90deg,var(--accent,#d98f7a),var(--amber,#b58bb0))\"><\u002Fdiv>\n    <p style=\"max-width:520px;margin:0 auto;font-size:18px;line-height:1.7;color:var(--muted,rgba(231,220,224,.62));font-weight:300\">I'm Vincent — I fix complex systems and make things at the seam between engineering and art. This is where I keep my work and post ideas I'm pondering.<\u002Fp>\n    <div style=\"display:flex;gap:14px;justify-content:center;margin-top:40px;flex-wrap:wrap\">\n      <a href=\"#writing\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.5px;padding:14px 26px;border-radius:999px;background:var(--accent,#d98f7a);color:var(--accent-ink,#2b1d1c);text-decoration:none;font-weight:500\">READ THE WRITING<\u002Fa>\n      <sc-if value=\"{{ showResume }}\" hint-placeholder-val=\"{{ true }}\">\n      <a href=\"#\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.5px;padding:14px 26px;border-radius:999px;border:1px solid var(--line2,rgba(231,220,224,.17));background:transparent;color:var(--fg,#e7dce0);text-decoration:none\">RÉSUMÉ ↓<\u002Fa>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ABOUT -->\n  <section id=\"about\" style=\"scroll-margin-top:80px;max-width:760px;margin:0 auto;padding:70px 32px;text-align:center\">\n    <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--accent,#d98f7a)\">ABOUT<\u002Fdiv>\n    <img src=\"fb021247-17b9-4d13-b9ff-7955092d0d3b\" alt=\"Vincent Quach\" style=\"width:118px;height:118px;border-radius:50%;margin:30px auto 32px;object-fit:cover;display:block;border:1px solid var(--line2,rgba(231,220,224,.17))\">\n    <p style=\"font-size:19px;line-height:1.75;font-weight:300;color:var(--fg,#e7dce0);max-width:600px;margin:0 auto\">I care about work that rejects the world as merely given and remakes it — but within humanistic constraints. Technology that stays sensible, systems that represent genuine beauty, and craft that preserves life. I move between fixing software and repairing technologies in an effort to merge engineering and art.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:52px\">\n      <div><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:2px;color:var(--faint,rgba(231,220,224,.4));margin-bottom:9px\">CURRENTLY<\u002Fdiv><div style=\"font-size:15px;color:var(--fg,#e7dce0)\">Cryptologic Technician<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:2px;color:var(--faint,rgba(231,220,224,.4));margin-bottom:9px\">FOCUS<\u002Fdiv><div style=\"font-size:15px;color:var(--fg,#e7dce0)\">Engineering × Art<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:2px;color:var(--faint,rgba(231,220,224,.4));margin-bottom:9px\">BASED<\u002Fdiv><div style=\"font-size:15px;color:var(--fg,#e7dce0)\">San Diego, CA, for now<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WRITING -->\n  <section id=\"writing\" style=\"scroll-margin-top:80px;max-width:720px;margin:0 auto;padding:70px 32px;text-align:center\">\n    <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--accent,#d98f7a)\">WRITING<\u002Fdiv>\n    <p style=\"font-size:15px;color:var(--muted,rgba(231,220,224,.62));margin:14px 0 8px;font-weight:300\">Notes on building, making, and everything in between.<\u002Fp>\n    <div style=\"margin-top:26px;text-align:left\">\n      <a href=\"#\" style=\"display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:baseline;border-top:1px solid var(--line,rgba(231,220,224,.1));padding:24px 0;text-decoration:none;color:inherit\">\n        <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--faint,rgba(231,220,224,.4));letter-spacing:.5px\">2026.06<\u002Fdiv>\n        <div><div style=\"font-size:19px;font-weight:400;color:var(--fg,#e7dce0)\">On engineering as an art form<\u002Fdiv><div style=\"font-size:14px;color:var(--muted,rgba(231,220,224,.62));margin-top:6px;line-height:1.55\">Why the tools we build deserve the same care as the things we frame and hang on walls.<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#\" style=\"display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:baseline;border-top:1px solid var(--line,rgba(231,220,224,.1));padding:24px 0;text-decoration:none;color:inherit\">\n        <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--faint,rgba(231,220,224,.4));letter-spacing:.5px\">2026.04<\u002Fdiv>\n        <div><div style=\"font-size:19px;font-weight:400;color:var(--fg,#e7dce0)\">Shipping things that last<\u002Fdiv><div style=\"font-size:14px;color:var(--muted,rgba(231,220,224,.62));margin-top:6px;line-height:1.55\">A short field guide to building for the long horizon without freezing up.<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#\" style=\"display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:baseline;border-top:1px solid var(--line,rgba(231,220,224,.1));border-bottom:1px solid var(--line,rgba(231,220,224,.1));padding:24px 0;text-decoration:none;color:inherit\">\n        <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--faint,rgba(231,220,224,.4));letter-spacing:.5px\">2026.01<\u002Fdiv>\n        <div><div style=\"font-size:19px;font-weight:400;color:var(--fg,#e7dce0)\">Why \"tomorrow comes\"<\u002Fdiv><div style=\"font-size:14px;color:var(--muted,rgba(231,220,224,.62));margin-top:6px;line-height:1.55\">The phrase behind everything I make, and the quiet optimism under it.<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT -->\n  <section id=\"contact\" style=\"scroll-margin-top:80px;max-width:720px;margin:0 auto;padding:70px 32px 40px;text-align:center\">\n    <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--accent,#d98f7a)\">CONTACT<\u002Fdiv>\n    <a href=\"mailto:vncntqch@gmail.com\" style=\"display:inline-block;font-size:clamp(24px,4vw,34px);font-weight:300;letter-spacing:-.5px;color:var(--fg,#e7dce0);text-decoration:none;margin-top:22px;border-bottom:1px solid var(--accent,#d98f7a);padding-bottom:3px\">vncntqch@gmail.com<\u002Fa>\n    <div style=\"display:flex;gap:26px;justify-content:center;margin-top:34px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.5px\">DISCORD: vinceptive ↗\n      <a href=\"https://www.linkedin.com/in/vincent-q-39409064\" target=\"_blank\" rel=\"noopener\" style=\"color: #E7DCE09E; text-decoration: none\">LINKEDIN ↗<\u002Fa>\n      \n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid var(--line,rgba(231,220,224,.1));padding:26px 32px;margin-top:40px\">\n    <div style=\"display:flex;justify-content:center;align-items:center;gap:14px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.5px;color:var(--faint,rgba(231,220,224,.4))\">\n      <span>© 2026 Vincent Quach<\u002Fspan><span>·<\u002Fspan>\n      <button onclick=\"{{ openGate }}\" title=\"Private\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1px;background:transparent;border:none;color:var(--faint,rgba(231,220,224,.4));cursor:pointer;padding:2px 4px\">◆ private<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== DASHBOARD ===================== -->\n<sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Private dashboard\" style=\"position:relative;z-index:1\">\n\n  <header style=\"position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--nav,rgba(43,37,48,.75));border-bottom:1px solid var(--line,rgba(231,220,224,.1))\">\n    <div style=\"max-width:1000px;margin:0 auto;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:1.5px;color:var(--accent,#d98f7a)\">◆ PRIVATE DASHBOARD<\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\">\n        <button onclick=\"{{ toggleTheme }}\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:1.5px;padding:8px 14px;border:1px solid var(--line2,rgba(231,220,224,.17));background:transparent;color:var(--fg,#e7dce0);border-radius:999px;cursor:pointer\">{{ themeLabel }}<\u002Fbutton>\n        <button onclick=\"{{ backToSite }}\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:1.5px;padding:8px 14px;border:1px solid var(--line2,rgba(231,220,224,.17));background:transparent;color:var(--muted,rgba(231,220,224,.62));border-radius:999px;cursor:pointer;white-space:nowrap\">← SITE<\u002Fbutton>\n        <button onclick=\"{{ lockDash }}\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:1.5px;padding:8px 14px;border:none;background:var(--accent,#d98f7a);color:var(--accent-ink,#2b1d1c);border-radius:999px;cursor:pointer\">LOCK<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"max-width:1000px;margin:0 auto;padding:44px 32px 90px\">\n\n    <div style=\"display:flex;justify-content:center;margin-bottom:40px\">\n      <div style=\"display:flex;gap:5px;background:var(--surface,#342d3a);padding:5px;border-radius:999px;border:1px solid var(--line,rgba(231,220,224,.1))\">\n        <button data-tab=\"calendar\" onclick=\"{{ onTab }}\" style=\"{{ calBtnStyle }}\">CALENDAR<\u002Fbutton>\n        <button data-tab=\"goals\" onclick=\"{{ onTab }}\" style=\"{{ goalsBtnStyle }}\">GOALS<\u002Fbutton>\n        <button data-tab=\"groceries\" onclick=\"{{ onTab }}\" style=\"{{ grocBtnStyle }}\">GROCERIES<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- CALENDAR -->\n    <sc-if value=\"{{ isCal }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:8px\">\n        <button onclick=\"{{ prevMonth }}\" style=\"width:36px;height:36px;border-radius:50%;border:1px solid var(--line2,rgba(231,220,224,.17));background:transparent;color:var(--fg,#e7dce0);cursor:pointer;font-size:17px;line-height:1\">‹<\u002Fbutton>\n        <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:16px;letter-spacing:1px;min-width:210px;text-align:center;color:var(--fg,#e7dce0)\">{{ monthLabel }}<\u002Fdiv>\n        <button onclick=\"{{ nextMonth }}\" style=\"width:36px;height:36px;border-radius:50%;border:1px solid var(--line2,rgba(231,220,224,.17));background:transparent;color:var(--fg,#e7dce0);cursor:pointer;font-size:17px;line-height:1\">›<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"text-align:center;margin-bottom:26px\"><button onclick=\"{{ goToday }}\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:1.5px;background:transparent;border:none;color:var(--accent,#d98f7a);cursor:pointer\">· TODAY ·<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px\">\n        <sc-for list=\"{{ weekdays }}\" as=\"wd\" hint-placeholder-count=\"7\">\n          <div style=\"text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:1px;color:var(--faint,rgba(231,220,224,.4))\">{{ wd }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:8px\">\n        <sc-for list=\"{{ calCells }}\" as=\"cell\" hint-placeholder-count=\"42\">\n          <div onclick=\"{{ openDay }}\" data-date=\"{{ cell.date }}\" style=\"{{ cell.style }}\">\n            <div style=\"{{ cell.dayStyle }}\">{{ cell.day }}<\u002Fdiv>\n            <sc-for list=\"{{ cell.shownEvents }}\" as=\"ev\" hint-placeholder-count=\"0\">\n              <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.2px;background:var(--chip,rgba(217,143,122,.15));color:var(--accent,#d98f7a);padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35\">{{ ev.title }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ cell.hasMore }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;color:var(--faint,rgba(231,220,224,.4))\">{{ cell.moreLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:1px;color:var(--faint,rgba(231,220,224,.4));margin-top:22px\">CLICK ANY DAY TO ADD A DATE<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- GOALS -->\n    <sc-if value=\"{{ isGoals }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:900px;margin:0 auto\">\n      <div style=\"display:grid;grid-template-columns:2.2fr 1.1fr 1.1fr 1.2fr 40px;gap:12px;padding:0 4px 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:1.5px;color:var(--faint,rgba(231,220,224,.4));border-bottom:1px solid var(--line2,rgba(231,220,224,.17))\">\n        <div>GOAL<\u002Fdiv><div>PRIORITY<\u002Fdiv><div>TARGET DATE<\u002Fdiv><div>STATUS<\u002Fdiv><div><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ goalRows }}\" as=\"gr\" hint-placeholder-count=\"2\">\n        <div style=\"display:grid;grid-template-columns:2.2fr 1.1fr 1.1fr 1.2fr 40px;gap:12px;align-items:center;border-bottom:1px solid var(--line,rgba(231,220,224,.1));padding:5px 4px\">\n          <input value=\"{{ gr.goal }}\" data-idx=\"{{ gr.idx }}\" data-field=\"goal\" onchange=\"{{ editGoal }}\" placeholder=\"New goal…\" style=\"width:100%;background:transparent;border:none;outline:none;color:var(--fg,#e7dce0);font-family:'Cabin',system-ui,sans-serif;font-size:14.5px;padding:9px 4px\">\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"{{ gr.prDotStyle }}\"><\u002Fspan>\n            <select value=\"{{ gr.priority }}\" data-idx=\"{{ gr.idx }}\" data-field=\"priority\" onchange=\"{{ editGoal }}\" style=\"flex:1;background:transparent;border:none;outline:none;color:var(--fg,#e7dce0);font-family:'Cabin',system-ui,sans-serif;font-size:14px;cursor:pointer;appearance:none;-webkit-appearance:none\">\n              <option>Low<\u002Foption><option>Medium<\u002Foption><option>High<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <input type=\"date\" value=\"{{ gr.target }}\" data-idx=\"{{ gr.idx }}\" data-field=\"target\" onchange=\"{{ editGoal }}\" style=\"width:100%;background:transparent;border:none;outline:none;color:var(--muted,rgba(231,220,224,.62));font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;padding:9px 2px\">\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"{{ gr.stDotStyle }}\"><\u002Fspan>\n            <select value=\"{{ gr.status }}\" data-idx=\"{{ gr.idx }}\" data-field=\"status\" onchange=\"{{ editGoal }}\" style=\"flex:1;background:transparent;border:none;outline:none;color:var(--fg,#e7dce0);font-family:'Cabin',system-ui,sans-serif;font-size:14px;cursor:pointer;appearance:none;-webkit-appearance:none\">\n              <option>Not started<\u002Foption><option>In progress<\u002Foption><option>Done<\u002Foption><option>Blocked<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <button data-idx=\"{{ gr.idx }}\" onclick=\"{{ deleteGoal }}\" title=\"Delete\" style=\"background:transparent;border:none;co   <input value=\"{{ eventDraft }}\" onchange=\"{{ onEventDraft }}\" placeholder=\"Add a date…\" style=\"flex:1;background:var(--bg,#2b2530);border:1px solid var(--line2,rgba(231,220,224,.17));border-radius:9px;outline:none;color:var(--fg,#e7dce0);font-family:'Cabin',system-ui,sans-serif;font-size:14px;padding:11px 13px\">\n      <button type=\"submit\" style=\"font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1px;padding:0 20px;border:none;border-radius:9px;background:var(--accent,#d98f7a);color:var(--accent-ink,#2b1d1c);cursor:pointer;font-weight:500\">ADD<\u002Fbutton>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;bgTexture&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;dots&quot;,&quot;none&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;showResume&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nconst PASS = 'saskia';\n\n// ---- Supabase sync (Option A: anon key, single shared row) ----\nconst SB_URL = 'https://mwrjsfsmcwiywztkhmoc.supabase.co';\nconst SB_KEY = 'sb_publishable_gO8XI50EdR415xXhh5xNsw_yqh_dplw';\nconst SB_ROW = 'vq';\nlet _sb = null;\nfunction sb() {\n  if (_sb) return _sb;\n  try { if (window.supabase && window.supabase.createClient) _sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) {}\n  return _sb;\n}\nconst uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : (String(Date.now()) + Math.random().toString(36).slice(2));\nconst pad = (n) => String(n).padStart(2, '0');\nconst fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\n\nclass Component extends DCLogic {\n  state = {\n    theme: 'dark', view: 'site', authed: false, authError: '', passInput: '',\n    tab: 'calendar', monthOffset: 0, selectedDate: null, eventDraft: '',\n    gateOpen: false, events: {}, goals: [], groceries: []\n  };\n\n  componentDidMount() {\n    // 1) Instant hydrate from local cache (works offline / before network).\n    let events = {}, goals = [], groceries = [], theme = this.props.startTheme || 'dark', authed = false;\n    try {\n      const t = localStorage.getItem('vq_theme'); if (t) theme = t;\n      const ev = JSON.parse(localStorage.getItem('vq_events') || 'null');\n      const go = JSON.parse(localStorage.getItem('vq_goals') || 'null');\n      const gr = JSON.parse(localStorage.getItem('vq_groc') || 'null');\n      events = ev || this.seedEvents();\n      goals = go || this.seedGoals();\n      groceries = gr || this.seedGroc();\n      authed = sessionStorage.getItem('vq_authed') === '1';\n    } catch (e) { events = this.seedEvents(); goals = this.seedGoals(); groceries = this.seedGroc(); }\n    const view = (location.hash === '#private' && authed) ? 'dashboard' : 'site';\n    const gateOpen = location.hash === '#private' && !authed;\n    this.setState({ theme, events, goals, groceries, authed, view, gateOpen });\n    // 2) Then pull the authoritative copy from Supabase and overwrite.\n    this.loadRemote();\n    this._key = (e) => { if (e.key === 'Escape') this.setState({ gateOpen: false, selectedDate: null }); };\n    window.addEventListener('keydown', this._key);\n    this._raf = requestAnimationFrame(this._loop);\n  }\n\n  async loadRemote() {\n    const client = sb();\n    if (!client) return;\n    try {\n      const { data, error } = await client.from('dashboard').select('theme,events,goals,groceries').eq('id', SB_ROW).single();\n      if (error || !data) return;\n      const next = {};\n      if (data.theme) next.theme = data.theme;\n      if (data.events && typeof data.events === 'object') next.events = data.events;\n      if (Array.isArray(data.goals)) next.goals = data.goals;\n      if (Array.isArray(data.groceries)) next.groceries = data.groceries;\n      this._loaded = true;\n      this.setState(next, () => this.cacheLocal());\n    } catch (e) { /* stay on cached copy */ }\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._key); if (this._raf) cancelAnimationFrame(this._raf); clearTimeout(this._pushT); }\n\n  _loop = () => {\n    let el = this._photoEl;\n    if (!el || !el.isConnected) el = this._photoEl = document.querySelector('[data-parallax=\"hero\"]');\n    if (el && el.parentNode) {\n      const top = el.parentNode.getBoundingClientRect().top;\n      if (this._lastTop === undefined || Math.abs(top - this._lastTop) > 0.4) {\n        this._lastTop = top;\n        el.style.transform = 'translate3d(0,' + (-top * 0.3).toFixed(1) + 'px,0)';\n      }\n    }\n    this._raf = requestAnimationFrame(this._loop);\n  };\n\n  seedEvents() { const d = new Date(); return { [fmt(new Date(d.getFullYear(), d.getMonth(), 15))]: [{ id: uid(), title: 'Portfolio review' }] }; }\n  seedGoals() { return [\n    { id: uid(), goal: 'Launch personal site', priority: 'High', target: '', status: 'In progress' },\n    { id: uid(), goal: 'Write first essay', priority: 'Medium', target: '', status: 'Not started' }\n  ]; }\n  seedGroc() { return [\n    { id: uid(), item: 'Coffee beans', qty: '1 bag', store: 'Local roaster', notes: 'medium roast', done: false },\n    { id: uid(), item: 'Eggs', qty: '12', store: 'Grocery', notes: '', done: false }\n  ]; }\n\n  cacheLocal() { try {\n    localStorage.setItem('vq_theme', this.state.theme);\n    localStorage.setItem('vq_events', JSON.stringify(this.state.events));\n    localStorage.setItem('vq_goals', JSON.stringify(this.state.goals));\n    localStorage.se
